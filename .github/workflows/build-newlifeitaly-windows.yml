name: Build NewLifeItaly Viewer for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - newlifeitaly/viewer-1.0

permissions:
  contents: read

env:
  AUTOBUILD_VARIABLES_FILE: ${{ github.workspace }}/build-variables/variables
  AUTOBUILD_VSVER: "170"
  AUTOBUILD_BUILD_ID: ${{ github.run_number }}

jobs:
  windows-x64:
    name: Windows 64-bit Setup
    runs-on: windows-2022
    timeout-minutes: 240

    steps:
      - name: Checkout NewLifeItaly Viewer
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Firestorm build variables
        uses: actions/checkout@v4
        with:
          repository: FirestormViewer/fs-build-variables
          path: build-variables

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed" }
          python -m pip install -r requirements.txt "cmake>=4.1.2"
          if ($LASTEXITCODE -ne 0) { throw "Python build dependencies failed" }
          choco install nsis -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "NSIS installation failed" }
          "C:\Program Files\Git\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Apply verified NewLifeItaly source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $exclude = @(
            "--exclude=indra/newview/app_settings/commands.xml",
            "--exclude=indra/newview/viewer_manifest.py",
            "--exclude=indra/newview/skins/default/xui/en/floater_preferences.xml"
          )

          git apply --check --recount @exclude newlifeitaly/patches/viewer.patch
          if ($LASTEXITCODE -ne 0) { throw "Legacy NewLifeItaly patch validation failed" }
          git apply --recount @exclude newlifeitaly/patches/viewer.patch
          if ($LASTEXITCODE -ne 0) { throw "Legacy NewLifeItaly patch application failed" }

          git apply --check --recount newlifeitaly/patches/viewer-compat.patch
          if ($LASTEXITCODE -ne 0) { throw "Current-source compatibility patch validation failed" }
          git apply --recount newlifeitaly/patches/viewer-compat.patch
          if ($LASTEXITCODE -ne 0) { throw "Current-source compatibility patch application failed" }

          git apply --check --recount newlifeitaly/patches/nli-hardening.patch
          if ($LASTEXITCODE -ne 0) { throw "NewLifeItaly hardening patch validation failed" }
          git apply --recount newlifeitaly/patches/nli-hardening.patch
          if ($LASTEXITCODE -ne 0) { throw "NewLifeItaly hardening patch application failed" }

      - name: Apply NewLifeItaly Windows branding
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $parts = Get-ChildItem "newlifeitaly\branding\release-os.tar.gz.b64.part*" | Sort-Object Name
          if (-not $parts) { throw "NewLifeItaly branding archive parts are missing" }
          $encoded = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          $archive = Join-Path $env:RUNNER_TEMP "newlifeitaly-release-os.tar.gz"
          [IO.File]::WriteAllBytes($archive, [Convert]::FromBase64String($encoded))
          & "$env:SystemRoot\System32\tar.exe" -xzf $archive -C "indra\newview\icons\release-os"
          if ($LASTEXITCODE -ne 0) { throw "Branding archive extraction failed" }

          Copy-Item "newlifeitaly\branding\icons\firestorm_*.png" "indra\newview\icons\release-os\" -Force
          Copy-Item "newlifeitaly\branding\icons\firestorm_icon.ico" "indra\newview\icons\release-os\firestorm_icon.ico" -Force
          Copy-Item "newlifeitaly\branding\icons\firestorm_icon.ico" "indra\newview\res\firestorm_icon.ico" -Force
          Copy-Item "newlifeitaly\branding\icons\firestorm_icon.ico" "indra\newview\installers\windows\firestorm_icon.ico" -Force
          Copy-Item "newlifeitaly\branding\icons\firestorm_icon.ico" "indra\newview\installers\windows\firestorm_icon_os.ico" -Force

          Add-Type -AssemblyName System.Drawing
          $sourcePng = [System.Drawing.Image]::FromFile((Resolve-Path "newlifeitaly\branding\icons\firestorm_256.png"))
          try {
            $bitmap = New-Object System.Drawing.Bitmap $sourcePng
            $bitmap.Save((Join-Path $PWD "indra\newview\icons\release-os\firestorm_256.bmp"), [System.Drawing.Imaging.ImageFormat]::Bmp)
            $bitmap.Dispose()
          } finally {
            $sourcePng.Dispose()
          }

          $brandHash = (Get-FileHash "newlifeitaly\branding\icons\firestorm_icon.ico" -Algorithm SHA256).Hash
          @(
            "indra\newview\icons\release-os\firestorm_icon.ico",
            "indra\newview\res\firestorm_icon.ico",
            "indra\newview\installers\windows\firestorm_icon.ico",
            "indra\newview\installers\windows\firestorm_icon_os.ico"
          ) | ForEach-Object {
            if ((Get-FileHash $_ -Algorithm SHA256).Hash -ne $brandHash) {
              throw "NewLifeItaly icon was not installed into $_"
            }
          }

      - name: Verify NewLifeItaly acceptance criteria
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $network = Get-Content "indra\newview\llviewernetwork.cpp" -Raw
          if ($network -notmatch 'NLI_GRID_NAME = "newlifeitaly\.com:8002"') { throw "NLI grid constant missing" }
          if ($network -notmatch 'mGrid = NLI_GRID_NAME') { throw "Startup is not locked to NewLifeItaly" }
          if ($network -notmatch 'NewLifeItaly login lock rejected grid') { throw "Alternate-grid rejection missing" }
          if ($network -notmatch 'if \(grid_iter->first == NLI_GRID_NAME\)') { throw "Alternate grids are still exposed" }
          if ($network -notmatch 'grid_name\.empty\(\) \|\| grid_name != NLI_GRID_NAME') { throw "Alternate grids can still be selected" }

          $commands = Get-Content "indra\newview\app_settings\commands.xml" -Raw
          if ($commands -notmatch 'name="voice"[\s\S]*?label_ref="Command_NLI_Multiview_Label"[\s\S]*?execute_parameters="nli_media"') { throw "Cam/Mic command is not wired" }
          if ($commands -match 'name="nli_multiview"') { throw "Duplicate NLI toolbar command detected" }

          $toolbar = Get-Content "indra\newview\lltoolbarview.cpp" -Raw
          if ($toolbar -notmatch 'const LLCommandId nli_media_command\("voice"\)') { throw "Cam/Mic toolbar injection missing" }

          $prefs = Get-Content "indra\newview\skins\default\xui\en\floater_preferences.xml" -Raw
          if ($prefs -notmatch '(?s)<panel\s+enabled="false"\s+visible="false"\s+class="panel_preference_opensim"') { throw "Grid management preferences are still visible" }

          $login = Get-Content "indra\newview\skins\default\xui\en\panel_login.xml" -Raw
          if ($login -notmatch '(?s)<combo_box\s+allow_text_entry="false"\s+visible="false".*?name="server_combo"') { throw "Grid selector is still visible at login" }

          $manifest = Get-Content "indra\newview\viewer_manifest.py" -Raw
          if ($manifest -notmatch 'def app_name\(self\):[\s\S]*?return CHANNEL_VENDOR_BASE') { throw "Viewer application name is not fixed" }

          $resourceScript = Get-Content "indra\newview\res\viewerRes.rc" -Raw
          if ($resourceScript -notmatch 'IDI_LL_ICON\s+ICON\s+"firestorm_icon\.ico"') { throw "Viewer EXE icon resource is not wired" }

          $installerTemplate = Get-Content "indra\newview\installers\windows\installer_template.nsi" -Raw
          if ($installerTemplate -notmatch 'firestorm_icon\$\{ICON_SUFFIX\}\.ico') { throw "Installer icon resource is not wired" }

          Write-Host "VERIFIED: NewLifeItaly-only login, no visible Grid Manager, mandatory Cam/Mic button, NLI Windows icons."

      - name: Configure official NewLifeItaly build
        shell: pwsh
        run: |
          autobuild configure -A 64 -c ReleaseFS_open -- `
            --package `
            --chan "NewLifeItaly Viewer Release" `
            --singlegrid "http://newlifeitaly.com:8002" `
            --openal
          if ($LASTEXITCODE -ne 0) { throw "autobuild configure failed" }

      - name: Compile and create Windows package
        shell: pwsh
        run: |
          autobuild build -A 64 -c ReleaseFS_open --no-configure
          if ($LASTEXITCODE -ne 0) { throw "autobuild build failed" }

          $buildDir = "build-vc${env:AUTOBUILD_VSVER}-64"
          if (-not (Test-Path -LiteralPath $buildDir)) { throw "Build directory not found: $buildDir" }
          cmake --build $buildDir --config Release --target llpackage
          if ($LASTEXITCODE -ne 0) { throw "llpackage failed" }

      - name: Verify compiled package and stage Setup v4
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $buildDir = "build-vc${env:AUTOBUILD_VSVER}-64"
          $installer = Get-ChildItem $buildDir -Filter "*_Setup.exe" -File -Recurse -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if (-not $installer) { throw "Windows Setup was not generated" }

          $viewerExe = Get-ChildItem $buildDir -Filter "*.exe" -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -ne $installer.FullName -and $_.Name -notmatch 'uninst|crash|plugin|slplugin|win_crash_logger' } |
            Sort-Object Length -Descending | Select-Object -First 1
          if (-not $viewerExe) { throw "Compiled Viewer executable not found" }

          Add-Type -AssemblyName System.Drawing
          function Get-IconHash([string]$Path, [bool]$Executable) {
            $icon = $null; $bmp = $null; $g = $null; $ms = $null; $sha = $null
            try {
              if ($Executable) { $icon = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path $Path).Path) }
              else { $icon = New-Object System.Drawing.Icon((Resolve-Path $Path).Path, 32, 32) }
              if (-not $icon) { throw "Cannot extract icon from $Path" }
              $bmp = New-Object System.Drawing.Bitmap 32, 32
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              $g.Clear([System.Drawing.Color]::Transparent)
              $g.DrawIcon($icon, 0, 0)
              $ms = New-Object System.IO.MemoryStream
              $bmp.Save($ms, [System.Drawing.Imaging.ImageFormat]::Png)
              $sha = [System.Security.Cryptography.SHA256]::Create()
              return ([BitConverter]::ToString($sha.ComputeHash($ms.ToArray()))).Replace("-", "")
            } finally {
              if ($sha) { $sha.Dispose() }; if ($ms) { $ms.Dispose() }; if ($g) { $g.Dispose() }; if ($bmp) { $bmp.Dispose() }; if ($icon) { $icon.Dispose() }
            }
          }

          $expected = Get-IconHash "newlifeitaly\branding\icons\firestorm_icon.ico" $false
          if ((Get-IconHash $installer.FullName $true) -ne $expected) { throw "Setup icon is not NewLifeItaly" }
          if ((Get-IconHash $viewerExe.FullName $true) -ne $expected) { throw "Viewer EXE icon is not NewLifeItaly" }

          $artifactDir = Join-Path $env:GITHUB_WORKSPACE "newlife-artifact"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          $setup = Join-Path $artifactDir "NewLifeItaly-Viewer-Windows-x64-Setup-v4.exe"
          Copy-Item $installer.FullName $setup -Force
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          "$hash  NewLifeItaly-Viewer-Windows-x64-Setup-v4.exe" | Set-Content "$setup.sha256" -Encoding ascii
          Write-Host "VERIFIED COMPILED VIEWER: $($viewerExe.FullName)"
          Write-Host "VERIFIED SETUP: $setup"
          Write-Host "SHA-256: $hash"

      - name: Upload NewLifeItaly Setup v4
        uses: actions/upload-artifact@v4
        with:
          name: NewLifeItaly-Viewer-Windows-x64-v4
          path: |
            newlife-artifact/NewLifeItaly-Viewer-Windows-x64-Setup-v4.exe
            newlife-artifact/NewLifeItaly-Viewer-Windows-x64-Setup-v4.exe.sha256
          if-no-files-found: error
          retention-days: 14
